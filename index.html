<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laman web pertama</title>
    <style>
        html {
            box-sizing: border-box;
            min-height: 100vh;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top, #4a9cd3 0%, #254e7b 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 24px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(14px);
            padding: 30px;
        }

        h2 {
            margin: 0 0 18px;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 0.02em;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            font-size: 0.95rem;
            color: #e8f4ff;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            outline: none;
            font-size: 1rem;
        }

        input[type="email"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button {
            cursor: pointer;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            background: #ffca28;
            color: #1b1b1b;
            font-weight: 700;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            background: #e8b400;
        }

        #clockContainer {
            display: none;
            margin-top: 26px;
            text-align: center;
        }

        #clock {
            font-size: 2rem;
            margin-top: 10px;
            letter-spacing: 0.08em;
            font-family: "Courier New", Courier, monospace;
        }

        #analogContainer {
            margin-top: 24px;
        }

        canvas {
            max-width: 100%;
            display: block;
            margin: 12px auto 0;
            background: #fff;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Sila Masukkan E-mail Anda</h2>

        <form id="emailForm">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="user_email" placeholder="contoh@email.com" required>
            <button type="submit">Hantar</button>
        </form>

        <div id="clockContainer">
            <h3>Jam Digital</h3>
            <div id="clock"></div>

            <div id="analogContainer">
                <h3>Jam Analog</h3>
                <canvas id="analogClock" width="200" height="200"></canvas>
            </div>
        </div>
    </div>

    <script>
        const emailForm = document.getElementById('emailForm');
        const clockContainer = document.getElementById('clockContainer');
        const clockEl = document.getElementById('clock');
        const canvas = document.getElementById('analogClock');
        const ctx = canvas.getContext('2d');
        let clockInterval = null;

        emailForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const emailValue = document.getElementById('email').value.trim();
            if (!emailValue) return;
            clockContainer.style.display = 'block';
            emailForm.reset();
            updateClock();
            if (clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(updateClock, 1000);
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockEl.textContent = `${hours}:${minutes}:${seconds}`;
            drawAnalogClock(now);
        }

        function drawAnalogClock(now) {
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(radius, radius);
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#1a3a5c';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(0, 0, radius - 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#1a3a5c';
            ctx.fill();
            drawHand((now.getHours() % 12 + now.getMinutes() / 60) * 30, radius * 0.55, 6);
            drawHand(now.getMinutes() * 6, radius * 0.78, 5);
            drawHand(now.getSeconds() * 6, radius * 0.9, 2, '#e53935');
            ctx.restore();
        }

        function drawHand(angleDeg, length, width, color = '#1a3a5c') {
            const angle = (Math.PI / 180) * (angleDeg - 90);
            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineWidth = width;
            ctx.strokeStyle = color;
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
            ctx.stroke();
        }
    </script>

</body>

</html>
